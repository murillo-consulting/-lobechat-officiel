name: Upstream Sync

permissions:
  contents: write
  issues: write
  actions: write

on:
  schedule:
    # Candidate UTC times for 02:30 and 04:00 Europe/Paris across DST.
    # The local-time gate below ensures the sync runs only at 02:30 or 04:00 Paris time.
    - cron: '30 0,1 * * *'
    - cron: '0 2,3 * * *'
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Check Paris local time
        id: local_time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            PARIS_TIME="$(TZ=Europe/Paris date +%H:%M)"
            if [ "$PARIS_TIME" = "02:30" ] || [ "$PARIS_TIME" = "04:00" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v6
        if: steps.local_time.outputs.run == 'true'

      - name: Sync upstream changes
        if: steps.local_time.outputs.run == 'true'
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: lobehub/lobehub
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # automatically generated, no need to set
          test_mode: false
